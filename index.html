<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Thư viện giao diện HRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--p:#1967B2;--pd:#124E88;--tint:#E8F1FA;--bg:#F5F7FA;--tx:#0F172A;--mut:#64748B;--bd:#E2E8F0}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
header.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--bd);box-shadow:0 1px 8px rgba(0,0,0,.04)}
.bar{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{height:38px;display:block}
.brand b{display:block;font-size:17px;color:var(--pd)}.brand small{color:var(--mut);font-size:12px}
.search{flex:1 1 280px;max-width:460px;margin-left:auto}
.search input{width:100%;height:40px;border:1px solid var(--bd);border-radius:10px;padding:0 14px;font:inherit;font-size:14px;background:#F8FAFC;outline:none}
.search input:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(25,103,178,.15)}
.tabs{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;gap:6px}
.tab{appearance:none;border:0;background:none;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--mut);padding:10px 16px 12px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--p)}
.tab.on{color:var(--p);border-bottom-color:var(--p)}
.tab .n{font-size:12px;font-weight:600;background:#EEF2F7;color:#475569;border-radius:999px;padding:1px 9px}
.tab.on .n{background:var(--tint);color:var(--p)}
.note{max-width:1320px;margin:16px auto 0;padding:0 24px}
.note div{background:var(--tint);color:#124E88;border-radius:10px;padding:10px 14px;font-size:13px}
.chips{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;color:#475569;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--p);color:var(--p)}
main{max-width:1320px;margin:0 auto;padding:8px 24px 24px}
h2{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--p);margin:26px 0 14px;display:flex;align-items:center;gap:10px;scroll-margin-top:150px}
h2 span{background:var(--tint);color:var(--p);border-radius:999px;padding:1px 10px;font-size:12px;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--p);box-shadow:0 8px 24px rgba(25,103,178,.14)}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#EEF4FB,#F8FAFC);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:13px;border-bottom:1px solid var(--bd)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.meta{padding:12px 14px}.meta b{display:block;font-size:14px;font-weight:600}.meta small{color:var(--mut);font-size:11.5px;word-break:break-all}
.empty{display:none;text-align:center;color:var(--mut);padding:60px 0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:28px 0 40px}
</style>
</head>

<header class="top">
  <div class="bar">
    <a class="brand" href="./"><img src="shared/logo.png" alt="HRM"/><span><b>Thư viện giao diện HRM</b><small id="count"></small></span></a>
    <div class="search"><input id="q" type="search" placeholder="Tìm màn hình… (vd: lương, nghỉ phép, báo cáo)" autocomplete="off"/></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab on" id="tab-today" role="tab" type="button">Bản hôm nay <span class="n" id="n-today"></span></button>
    <button class="tab" id="tab-old" role="tab" type="button">Bản hôm qua <span class="n" id="n-old"></span></button>
  </div>
</header>
<div class="note"><div id="note"></div></div>
<div class="chips" id="chips"></div>
<main id="root"></main>
<div class="empty" id="empty">Không tìm thấy màn hình phù hợp.</div>

var cur = (location.hash === '#qua') ? 'old' : 'today';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function render(){
  var DATA = SETS[cur].data, q = document.getElementById('q').value, nq = norm(q||''), html='', shown=0;
  var groups=[]; DATA.forEach(function(d){ if(groups.indexOf(d.g)<0) groups.push(d.g) });
  var chips=''; groups.forEach(function(g,i){ chips+='<a class="chip" href="#g'+i+'">'+esc(g)+'</a>' });
  document.getElementById('chips').innerHTML = chips;
  groups.forEach(function(g,i){
    var items=DATA.filter(function(d){ return d.g===g && (!nq || norm(d.t+' '+d.h+' '+d.g).indexOf(nq)>=0) });
    if(!items.length) return; shown+=items.length;
    html+='<h2 id="g'+i+'">'+esc(g)+'<span>'+items.length+'</span></h2><div class="grid">';
    items.forEach(function(d){
      html+='<a class="card" href="'+esc(d.h)+'"><div class="thumb">'+(d.p?'<img loading="lazy" alt="" src="'+esc(d.p)+'" onerror="this.parentNode.textContent=\'Chưa có ảnh xem trước\'">':'Chưa có ảnh xem trước')+'</div><div class="meta"><b>'+esc(d.t)+'</b><small>'+esc(d.h)+'</small></div></a>';
    });
    html+='</div>';
  });
  document.getElementById('root').innerHTML=html;
  document.getElementById('empty').style.display=shown?'none':'block';
  document.getElementById('count').textContent=DATA.length+' màn hình'+(nq?' · '+shown+' kết quả':'');
  document.getElementById('note').textContent=SETS[cur].note;
  document.getElementById('tab-today').classList.toggle('on',cur==='today');
  document.getElementById('tab-old').classList.toggle('on',cur==='old');
}
function setTab(t){ cur=t; try{ history.replaceState(null,'',t==='old'?'#qua':location.pathname); }catch(e){} render(); window.scrollTo(0,0); }
document.getElementById('tab-today').addEventListener('click',function(){setTab('today')});
document.getElementById('tab-old').addEventListener('click',function(){setTab('old')});
document.getElementById('n-today').textContent=SETS.today.data.length;
document.getElementById('n-old').textContent=SETS.old.data.length;
document.getElementById('q').addEventListener('input',render);
render();
</script>
