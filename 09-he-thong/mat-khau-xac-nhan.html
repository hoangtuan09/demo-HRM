<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mật khẩu xác nhận — PMC HRM</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/tw-config.js"></script>
<link rel="stylesheet" href="../shared/fix.css"/>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen">
<a class="hrm-back" href="../index.html">&#8592; Thư viện</a>

<!-- Nền dashboard mô phỏng (làm mờ) -->
<div aria-hidden="true" class="fixed inset-0 select-none pointer-events-none blur-[5px] opacity-70">
  <div class="h-16 bg-surface-container-lowest border-b border-surface-container flex items-center px-6 gap-3">
    <div class="w-9 h-9 rounded bg-surface-container"></div><div class="w-40 h-4 rounded bg-surface-container"></div>
    <div class="ml-auto w-64 h-9 rounded-lg bg-surface-container"></div>
  </div>
  <div class="p-8 grid grid-cols-4 gap-5">
    <div class="h-24 rounded-xl bg-surface-container-lowest border border-surface-container"></div>
    <div class="h-24 rounded-xl bg-surface-container-lowest border border-surface-container"></div>
    <div class="h-24 rounded-xl bg-surface-container-lowest border border-surface-container"></div>
    <div class="h-24 rounded-xl bg-surface-container-lowest border border-surface-container"></div>
    <div class="col-span-4 h-72 rounded-xl bg-surface-container-lowest border border-surface-container"></div>
  </div>
</div>

<!-- Lớp phủ + modal -->
<div class="fixed inset-0 z-10 bg-[#0F172A]/45 backdrop-blur-[2px] flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-2xl overflow-hidden">
    <div class="flex items-start justify-between px-6 pt-5">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-lg bg-primary-container/10 text-primary flex items-center justify-center"><span class="material-symbols-outlined">verified_user</span></span>
        <div>
          <h2 class="font-headline-sm text-headline-sm text-on-surface">Mật khẩu xác nhận</h2>
          <p class="font-caption text-caption text-on-surface-variant">Nhập mật khẩu xác nhận để phê duyệt thao tác quan trọng.</p>
        </div>
      </div>
      <button class="w-8 h-8 inline-flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button>
    </div>
    <div class="px-6 py-5">
      <label class="block font-label-md text-label-md text-on-surface-variant mb-1.5">Mật khẩu xác nhận <span class="text-error">*</span></label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant">lock</span>
        <input type="password" value="••••••••••" class="w-full h-11 pl-9 pr-10 rounded-lg bg-surface-container-low border border-surface-container text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest" placeholder="Nhập mật khẩu" autocomplete="off"/>
        <button type="button" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined text-[18px]">visibility_off</span></button>
      </div>
      <p class="mt-2 font-caption text-caption text-on-surface-variant flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px] text-primary">info</span>Mật khẩu xác nhận do quản trị cấp, dùng cho các thao tác cấu hình nâng cao.</p>
    </div>
    <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-surface-container">
      <button type="button" class="h-[38px] px-space-lg rounded-lg bg-surface-container-lowest text-on-surface shadow-sm hover:bg-surface-container font-label-md">Thoát</button>
      <button type="button" class="h-[38px] px-space-xl rounded-lg bg-[#1967B2] hover:bg-[#124E88] text-white font-label-md">OK</button>
    </div>
  </div>
</div>
</body>
</html>
