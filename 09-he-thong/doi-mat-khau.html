<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đổi Mật Khẩu - Hệ Thống Quản Trị Nhân Sự PMC</title>
<!-- Google Fonts: Be Vietnam Pro -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#1967B2',
              hover: '#124E88',
              light: '#E8F1FA',
              bg: '#F5F7FA',
            },
            neutral: {
              heading: '#0F172A',
              body: '#475569',
              muted: '#94A3B8',
              border: '#E2E8F0',
            },
            status: {
              success: '#16A34A',
              warning: '#F59E0B',
              danger: '#DC2626',
              info: '#0EA5E9',
            }
          },
          boxShadow: {
            modal: '0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05)',
          },
          borderRadius: {
            'custom': '8px',
          }
        }
      }
    }
  </script>
<!-- Typography & Layout Styles -->
<style data-purpose="custom-typography">
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      color: #0F172A;
      background-color: #F5F7FA;
    }
    input::placeholder {
      color: #94A3B8;
    }
  </style>
<style data-purpose="animations">
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
<link rel="stylesheet" href="../shared/nav.css"/><link rel="stylesheet" href="../shared/fix.css"/></head>
<body class="relative min-h-screen overflow-x-hidden select-none bg-[#F5F7FA]">
<!-- BEGIN: HRM Dashboard Background -->
<!-- This section simulates an authentic Enterprise HRM system underneath the modal -->
<div aria-hidden="true" class="min-h-screen flex flex-col" data-purpose="hrm-dashboard-background">
<!-- Top Bar Header -->
<header class="h-16 bg-white border-b border-neutral-border flex items-center justify-between px-6 z-0">
<div class="flex items-center space-x-6">
<!-- PMC Brand Logo -->
<div class="flex items-center">

</div>
<!-- Breadcrumb Navigation -->
<nav class="hidden md:flex items-center space-x-2 text-xs text-neutral-body">
<span class="hover:text-brand cursor-pointer">Trang chủ</span>
<span>/</span>
<span class="hover:text-brand cursor-pointer">Quản lý tài khoản</span>
<span>/</span>
<span class="font-medium text-brand">Đổi mật khẩu</span>
</nav>
</div>
<!-- Header Search & User Profile -->
<div class="flex items-center space-x-4">
<div class="relative hidden sm:block w-72">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-neutral-muted">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</span>
<input class="w-full pl-9 pr-3 py-1.5 text-xs bg-gray-50 border border-neutral-border rounded-custom text-neutral-heading focus:outline-none" disabled="" placeholder="Tìm kiếm nhân viên, phòng ban..." type="text"/>
</div>
<!-- Notification Bell -->
<button class="relative p-2 text-neutral-body hover:text-brand rounded-custom" disabled="">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="absolute top-1 right-1 w-2 h-2 bg-status-danger rounded-full ring-2 ring-white"></span>
</button>
<!-- User Information -->
<div class="flex items-center space-x-3 pl-3 border-l border-neutral-border">
<div class="w-9 h-9 rounded-full bg-brand-light text-brand font-semibold text-xs flex items-center justify-center border border-brand/20">
            NA
          </div>
<div class="hidden lg:block text-left">
<div class="text-xs font-semibold text-neutral-heading leading-tight">Nguyễn Văn An</div>
<div class="text-[11px] text-neutral-body">Quản trị viên hệ thống</div>
</div>
</div>
</div>
</header>
<!-- Main Workspace with Sidebar -->
<div class="flex flex-1 overflow-hidden">
<!-- Left Navigation Sidebar -->
<aside id="app-sidebar" data-mode="flow" data-old-w="240"></aside>
<!-- Main Dashboard Content Grid -->
<main class="flex-1 p-6 space-y-6 overflow-hidden">
<!-- KPI Stats Cards -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
<div class="bg-white p-4 rounded-custom border border-neutral-border shadow-sm">
<span class="text-xs text-neutral-body">Tổng nhân sự</span>
<div class="text-xl font-bold text-neutral-heading mt-1">1,248</div>
<span class="text-[11px] text-status-success font-medium">↑ +3.2% so với tháng trước</span>
</div>
<div class="bg-white p-4 rounded-custom border border-neutral-border shadow-sm">
<span class="text-xs text-neutral-body">Đi làm hôm nay</span>
<div class="text-xl font-bold text-neutral-heading mt-1">98.4%</div>
<span class="text-[11px] text-neutral-body">1,228 / 1,248 nhân sự</span>
</div>
<div class="bg-white p-4 rounded-custom border border-neutral-border shadow-sm">
<span class="text-xs text-neutral-body">Đơn chờ duyệt</span>
<div class="text-xl font-bold text-status-warning mt-1">12</div>
<span class="text-[11px] text-neutral-body">8 nghỉ phép, 4 giải trình</span>
</div>
<div class="bg-white p-4 rounded-custom border border-neutral-border shadow-sm">
<span class="text-xs text-neutral-body">Tình trạng bảo mật</span>
<div class="text-xl font-bold text-status-danger mt-1">Yêu cầu đổi mật khẩu</div>
<span class="text-[11px] text-status-danger">Hết hạn sau 2 ngày</span>
</div>
</div>
<!-- Sample Mocked Table -->
<div class="bg-white rounded-custom border border-neutral-border p-4 shadow-sm">
<div class="h-6 w-48 bg-slate-200 rounded mb-4"></div>
<div class="space-y-3">
<div class="h-10 bg-slate-100 rounded"></div>
<div class="h-10 bg-slate-50 rounded"></div>
<div class="h-10 bg-slate-50 rounded"></div>
<div class="h-10 bg-slate-50 rounded"></div>
</div>
</div>
</main>
</div>
</div>
<!-- END: HRM Dashboard Background -->
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 z-40 bg-[#0F172A]/45 backdrop-blur-[6px] flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
<section aria-modal="true" class="w-full max-w-[460px] bg-white rounded-xl shadow-modal border border-neutral-border overflow-hidden my-auto">
<header class="px-6 py-4 border-b border-neutral-border flex items-center justify-between">
<h2 class="text-lg font-semibold text-neutral-heading tracking-tight">Đổi mật khẩu</h2>
<button aria-label="Đóng cửa sổ" class="text-neutral-muted hover:text-neutral-heading p-1.5 rounded-custom hover:bg-slate-100 transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</header>
<form class="p-6 space-y-4" onsubmit="event.preventDefault();">
<div class="space-y-1.5">
<label class="block text-xs font-medium text-neutral-heading" for="txtMatKhau">Mật khẩu hiện tại <span class="text-status-danger">*</span></label>
<input class="block w-full px-3 py-2.5 text-xs text-neutral-heading rounded-custom border border-neutral-border focus:border-brand focus:ring-1 focus:ring-brand outline-none transition" id="txtMatKhau" type="password" maxlength="50" autocomplete="off" required/>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-medium text-neutral-heading" for="txtMatKhauMoi">Mật khẩu mới <span class="text-status-danger">*</span></label>
<input class="block w-full px-3 py-2.5 text-xs text-neutral-heading rounded-custom border border-neutral-border focus:border-brand focus:ring-1 focus:ring-brand outline-none transition" id="txtMatKhauMoi" type="password" maxlength="50" autocomplete="off" required/>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-medium text-neutral-heading" for="txtMatKhauNhacLai">Nhắc lại mật khẩu <span class="text-status-danger">*</span></label>
<input class="block w-full px-3 py-2.5 text-xs text-neutral-heading rounded-custom border border-neutral-border focus:border-brand focus:ring-1 focus:ring-brand outline-none transition" id="txtMatKhauNhacLai" type="password" maxlength="50" autocomplete="off" required/>
</div>
</form>
<footer class="px-6 py-4 bg-slate-50 border-t border-neutral-border flex items-center justify-end space-x-3">
<button class="px-4 py-2.5 rounded-custom border border-neutral-border bg-white text-xs font-medium text-neutral-body hover:bg-slate-100 hover:text-neutral-heading transition" type="button">Thoát</button>
<button class="px-5 py-2.5 rounded-custom bg-brand hover:bg-brand-hover text-white text-xs font-medium shadow-sm transition" type="button">Đổi mật khẩu</button>
</footer>
</section>
</div>
<script src="../shared/nav.js"></script></body></html>
