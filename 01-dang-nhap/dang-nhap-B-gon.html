<!DOCTYPE html><html lang="vi"><head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#1967B2',
              hover: '#124E88',
              light: '#E8F1FA',
              subtle: '#F4F8FD',
            },
            surface: {
              DEFAULT: '#FFFFFF',
              app: '#F5F7FA',
            },
            content: {
              primary: '#0F172A',
              secondary: '#475569',
              muted: '#94A3B8',
            },
            border: '#E2E8F0',
            danger: {
              DEFAULT: '#DC2626',
              light: '#FEE2E2',
              border: '#FECACA',
            },
            success: '#16A34A',
            warning: '#F59E0B',
            info: '#0EA5E9',
          },
          borderRadius: {
            DEFAULT: '8px',
          },
          boxShadow: {
            card: '0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04)',
            soft: '0 2px 8px rgba(15, 23, 42, 0.06)',
            focused: '0 0 0 3px rgba(25, 103, 178, 0.15)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .brand-gradient {
      background: linear-gradient(135deg, #1967B2 0%, #124E88 100%);
    }
    .captcha-noise {
      background-color: #f1f5f9;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px), radial-gradient(#94a3b8 1px, #f1f5f9 1px);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
    }
    .skew-text {
      transform: skew(-6deg) rotate(-2deg);
      letter-spacing: 0.25em;
    }
  </style>
<link rel="stylesheet" href="../shared/fix.css"/></head>
<body class="bg-surface-app text-content-primary antialiased min-h-screen"><a class="hrm-back" href="../index.html">&#8592; Thư viện</a>
  <div class="flex flex-col lg:flex-row min-h-screen w-full">
    
    <!-- LEFT PANEL: Brand & Illustration (55% on lg screens, top banner on mobile) -->
    <div class="brand-gradient lg:w-[55%] w-full flex flex-col justify-between p-6 sm:p-10 lg:p-14 text-white relative overflow-hidden shrink-0">
      
      <!-- Background Ambient Geometric Vector Motifs -->
      <div class="absolute inset-0 pointer-events-none opacity-10">
        <svg class="w-full h-full object-cover" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Org-chart node representations & grid -->
          <circle cx="150" cy="180" r="40" stroke="white" stroke-width="2"></circle>
          <circle cx="350" cy="180" r="40" stroke="white" stroke-width="2"></circle>
          <circle cx="250" cy="340" r="50" stroke="white" stroke-width="2.5"></circle>
          <circle cx="450" cy="340" r="40" stroke="white" stroke-width="2"></circle>
          <circle cx="200" cy="520" r="35" stroke="white" stroke-width="2"></circle>
          <circle cx="380" cy="520" r="35" stroke="white" stroke-width="2"></circle>
          
          <!-- Hierarchy links -->
          <path d="M150 220 L150 280 L250 280 L250 290" stroke="white" stroke-width="2" stroke-dasharray="4 4"></path>
          <path d="M350 220 L350 280 L250 280" stroke="white" stroke-width="2" stroke-dasharray="4 4"></path>
          <path d="M250 390 L250 460 L200 460 L200 485" stroke="white" stroke-width="2"></path>
          <path d="M250 460 L380 460 L380 485" stroke="white" stroke-width="2"></path>
          <path d="M450 380 L450 460 L380 460" stroke="white" stroke-width="2" stroke-dasharray="4 4"></path>
          
          <!-- Soft ambient concentric rings -->
          <circle cx="650" cy="200" r="180" stroke="white" stroke-width="1.5" stroke-dasharray="6 6"></circle>
          <circle cx="650" cy="200" r="260" stroke="white" stroke-width="1"></circle>
          <circle cx="100" cy="700" r="220" stroke="white" stroke-width="1.5"></circle>
        </svg>
      </div>

      <!-- Top Header / Logo Lockup -->
      <div class="relative z-10 flex items-center justify-between lg:justify-start">
        <div class="flex items-center space-x-3"><div class="h-10 px-2 py-1 rounded-lg bg-white flex items-center justify-center shadow-md">
            <img src="../shared/img/img-11.png" alt="HRM" class="h-full w-auto object-contain">
          </div>
          <div class="flex flex-col">
            <span class="text-xl font-bold tracking-tight text-white leading-tight">HRM</span>
            <span class="text-xs text-blue-100 font-medium tracking-wider uppercase opacity-90">Enterprise Platform</span>
          </div></div>
              </div>

      <!-- Center Copy & HR Modules Showcase (Shown prominent on desktop) -->
      <div class="relative z-10 my-8 lg:my-auto max-w-xl">
                
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-white leading-[1.2] mb-4">
          Hệ thống Quản trị<br class="hidden sm:inline"> Nhân sự Thông minh
        </h1>
        
        
        </div>
<!-- Bottom Panel Footer -->
      <div class="relative z-10 pt-4 border-t border-white/15 flex flex-col sm:flex-row sm:items-center justify-between text-xs text-blue-100 gap-2">
        <p>© 2026 PMC. Bản quyền thuộc về PMC.</p>
              </div>
    </div>

    <!-- RIGHT PANEL: Login Form Card (45% on lg screens, full width on mobile) -->
    <div class="lg:w-[45%] w-full flex items-center justify-center p-4 sm:p-8 lg:p-12 bg-surface-app">
      <!-- Main Login Card -->
<div class="w-full max-w-[430px] bg-white rounded-xl shadow-card border border-border p-6 sm:p-8" id="loginCard">
<div class="mb-5">
<h2 class="text-2xl font-bold text-content-primary tracking-tight">Đăng nhập</h2>
</div>
<form class="space-y-4" method="post" onsubmit="event.preventDefault();">
<div>
<label class="block text-xs font-semibold text-content-primary mb-1.5" for="txtMa">Tài khoản</label>
<input type="text" id="txtMa" name="Ma" required class="block w-full px-3 py-2.5 text-sm bg-white border border-border rounded-lg text-content-primary focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition duration-150">
</div>
<div>
<label class="block text-xs font-semibold text-content-primary mb-1.5" for="txtMatKhau">Mật khẩu</label>
<input type="password" id="txtMatKhau" name="MatKhau" required class="block w-full px-3 py-2.5 text-sm bg-white border border-border rounded-lg text-content-primary focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition duration-150">
</div>
<div>
<label class="block text-xs font-semibold text-content-primary mb-1.5" for="DNT_CaptchaInputText">Mã xác nhận</label>
<div class="grid grid-cols-12 gap-2">
<div class="col-span-5 flex items-center rounded-lg border border-border overflow-hidden bg-slate-50">
<div class="flex-1 h-[42px] captcha-noise flex items-center justify-center select-none font-mono font-bold text-base text-slate-700 italic skew-text border-r border-border/80 px-2 tracking-widest">4821</div>
<button type="button" class="w-9 h-[42px] flex items-center justify-center text-content-secondary hover:text-brand hover:bg-slate-100 transition-colors" aria-label="Làm mới mã xác nhận">
<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
</button>
</div>
<div class="col-span-7">
<input type="text" id="DNT_CaptchaInputText" name="DNT_CaptchaInputText" required class="block w-full px-3 py-2.5 text-sm bg-white border border-border rounded-lg text-content-primary focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition duration-150 font-medium">
</div>
</div>
</div>
<div class="pt-2 text-center">
<button type="submit" class="w-full h-11 bg-brand hover:bg-brand-hover text-white font-medium text-sm rounded-lg shadow-sm hover:shadow transition duration-150 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand">Đăng nhập</button>
</div>
</form>
</div>
</div>
</div>
